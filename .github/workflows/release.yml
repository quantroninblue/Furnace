# Furnace macOS test build (Apple Silicon): a release build of the pinned Code OSS with the
# Furnace extension built in, ad-hoc signed, as a .dmg artifact. Not notarized.
# Runs on a pushed tag such as mac-v0.1.0-test1, or by hand once this file is on the default branch.
name: macOS build

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      UPSTREAM: prototypes/code-oss/upstream
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the upstream pin
        id: pin
        run: |
          echo "tag=$(node -p "require('./prototypes/code-oss/upstream-pin.json').tag")" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p "require('./prototypes/code-oss/upstream-pin.json').node")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pin.outputs.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Toolchain and disk
        run: |
          sw_vers; uname -m; xcode-select -print-path; c++ --version; node --version
          python3 -m pip install setuptools
          df -h .

      - name: Fetch the pinned Code OSS source
        run: git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" https://github.com/microsoft/vscode.git "$UPSTREAM"

      - name: Patch upstream and set the Furnace product identity
        run: node prototypes/code-oss/scripts/package-macos.mjs prepare

      - name: Install Code OSS dependencies
        working-directory: ${{ env.UPSTREAM }}
        env:
          npm_config_arch: arm64
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # As upstream's darwin build: link Kerberos directly instead of through dlopen.
          GYP_DEFINES: kerberos_use_rtld=false
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retrying"
          done
          exit 1

      - name: Build and package Code OSS (darwin-arm64, minified)
        working-directory: ${{ env.UPSTREAM }}
        run: npm run gulp vscode-darwin-arm64-min

      - name: Build Furnace
        run: |
          npm ci
          npm run build

      - name: Assemble, sign ad hoc and make the .dmg
        run: node prototypes/code-oss/scripts/package-macos.mjs assemble arm64

      # Upload before the checks, so a failing check still leaves the .dmg to inspect.
      - uses: actions/upload-artifact@v4
        with:
          name: Furnace-darwin-arm64
          path: prototypes/code-oss/.cache/dist/Furnace-darwin-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Furnace tests on macOS (includes the real Seatbelt sandbox test)
        run: |
          npm run typecheck
          npm test

      - name: Smoke test the packaged app
        run: |
          app="$(ls -d prototypes/code-oss/VSCode-darwin-arm64/*.app)"
          binary="$app/Contents/MacOS/$(ls "$app/Contents/MacOS")"
          # The app entry refuses host entries outside its built-in extensions.
          echo "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/ran', 'yes')" > "$RUNNER_TEMP/outside.cjs"
          if "$binary" "$RUNNER_TEMP/outside.cjs" --assistant-service "$RUNNER_TEMP" 2> "$RUNNER_TEMP/refused.txt"; then echo "outside entry was not refused"; exit 1; fi
          grep -q 'refusing to run' "$RUNNER_TEMP/refused.txt"
          test ! -e "$RUNNER_TEMP/ran"
          # The editor starts with the Furnace extension and stays up.
          profile="$RUNNER_TEMP/profile"
          "$binary" --user-data-dir "$profile/data" --extensions-dir "$profile/extensions" --skip-welcome --disable-updates --new-window &
          sleep 60
          kill -0 $! || { echo "Furnace exited during startup"; exit 1; }
          grep -rl 'ai-gui.workspace-product' "$profile/data/logs" | head -5 || true
          grep -rq 'ai-gui.workspace-product' "$profile/data/logs" || { echo "Furnace extension not seen in the logs"; exit 1; }
          kill $! || true
