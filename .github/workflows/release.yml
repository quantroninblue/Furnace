# Furnace release: release builds of the pinned Code OSS with the Furnace extension built in, for
# macOS (Apple Silicon, ad-hoc signed .dmg, not notarized), Windows (x64 per-user installer, not
# code-signed) and Linux (x64 .deb and .rpm), from the same commit.
#
# A tag like v0.2.1 (matching the version in prototypes/code-oss/product/package.json) builds all three,
# then makes a DRAFT GitHub Release with the downloads and the signed update feed (latest.json and
# latest.json.sig) of every platform that passed. Nothing reaches testers until the draft is published by
# hand; publishing makes it the release that releases/latest/download/latest.json points to, so installed
# copies offer it. A platform that failed is left out of the release and its feed (its installed copies
# keep their version and the landing page keeps linking its previous download): re-run its failed job
# (`gh run rerun <run> --failed`) to add it, even after publishing. A failure that needs a code fix ships
# in the next version instead.
#
# Pushes to main and pull requests that change the release build, a twice-weekly run on main, and manual
# runs build and check all three without releasing. The runs on main also keep the cache of the prepared
# Code OSS source and its dependencies (the slowest part) warm: tags restore main's cache.
# Tags with a suffix (v0.2.1-test1) only build too: the downloads stay as 14-day workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - prototypes/code-oss/upstream-pin.json
      - prototypes/code-oss/patches/**
      - prototypes/code-oss/product.overrides.json
      - prototypes/code-oss/release/**
      - prototypes/code-oss/scripts/release.mjs
      - prototypes/code-oss/scripts/release-feed.mjs
      - prototypes/code-oss/scripts/package-*.mjs
      - prototypes/code-oss/scripts/update-smoke.mjs
      - prototypes/code-oss/scripts/connections-smoke.mjs
      - prototypes/code-oss/product/updater.cjs
      - prototypes/code-oss/product/assistant/**
  pull_request:
    paths:
      - .github/workflows/release.yml
      - prototypes/code-oss/upstream-pin.json
      - prototypes/code-oss/patches/**
      - prototypes/code-oss/product.overrides.json
      - prototypes/code-oss/release/**
      - prototypes/code-oss/scripts/release.mjs
      - prototypes/code-oss/scripts/release-feed.mjs
      - prototypes/code-oss/scripts/package-*.mjs
      - prototypes/code-oss/scripts/update-smoke.mjs
      - prototypes/code-oss/scripts/connections-smoke.mjs
      - prototypes/code-oss/product/updater.cjs
      - prototypes/code-oss/product/assistant/**
  schedule:
    # Mondays and Thursdays: GitHub drops caches unused for 7 days.
    - cron: '23 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 240
    env:
      UPSTREAM: prototypes/code-oss/upstream
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the upstream pin
        id: pin
        run: |
          echo "tag=$(node -p "require('./prototypes/code-oss/upstream-pin.json').tag")" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p "require('./prototypes/code-oss/upstream-pin.json').node")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pin.outputs.node }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Toolchain and disk
        run: |
          sw_vers; uname -m; xcode-select -print-path; c++ --version; node --version
          python3 -m pip install setuptools
          df -h .

      # The patched upstream with its installed dependencies, saved after "Install Code OSS dependencies"
      # by runs on main. The key covers what that state depends on: the pin and the patches.
      - name: Restore the prepared Code OSS source and its dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UPSTREAM }}
          key: upstream-v1-${{ runner.os }}-arm64-${{ hashFiles('prototypes/code-oss/upstream-pin.json', 'prototypes/code-oss/patches/**') }}

      - name: Fetch the pinned Code OSS source
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" https://github.com/microsoft/vscode.git "$UPSTREAM"

      - name: Patch upstream and set the Furnace product identity and icons
        run: node prototypes/code-oss/scripts/package-macos.mjs prepare ${{ steps.cache.outputs.cache-hit == 'true' && '--cached' || '' }}

      - name: Install Code OSS dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.UPSTREAM }}
        env:
          npm_config_arch: arm64
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # As upstream's darwin build: link Kerberos directly instead of through dlopen.
          GYP_DEFINES: kerberos_use_rtld=false
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retrying"
          done
          exit 1

      # Only main saves: tags and pull requests can restore main's caches, but not each other's.
      - name: Cache the prepared Code OSS source and its dependencies
        if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UPSTREAM }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build and package Code OSS (darwin-arm64, minified)
        working-directory: ${{ env.UPSTREAM }}
        run: npm run gulp vscode-darwin-arm64-min

      - name: Build Furnace
        run: |
          npm ci
          npm run build

      - name: Assemble, sign ad hoc, make the .dmg and the update .zip
        run: node prototypes/code-oss/scripts/package-macos.mjs assemble arm64

      # Upload before the checks, so a failing check still leaves the build to inspect (the release
      # job only takes platforms whose checks passed). Overwrite: a re-run uploads again.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Furnace-darwin-arm64
          path: |
            prototypes/code-oss/.cache/dist/Furnace-darwin-arm64.dmg
            prototypes/code-oss/.cache/dist/Furnace-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Furnace tests on macOS (includes the real Seatbelt sandbox test)
        run: |
          npm run typecheck
          npm test

      - name: Smoke test the packaged app
        run: |
          app="$(ls -d prototypes/code-oss/VSCode-darwin-arm64/*.app)"
          binary="$app/Contents/MacOS/$(ls "$app/Contents/MacOS")"
          # The app entry refuses host entries outside its built-in extensions.
          echo "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/ran', 'yes')" > "$RUNNER_TEMP/outside.cjs"
          if "$binary" "$RUNNER_TEMP/outside.cjs" --assistant-service "$RUNNER_TEMP" 2> "$RUNNER_TEMP/refused.txt"; then echo "outside entry was not refused"; exit 1; fi
          grep -q 'refusing to run' "$RUNNER_TEMP/refused.txt"
          test ! -e "$RUNNER_TEMP/ran"
          # The release build carries the update feed and its public key.
          grep -q 'releases/latest/download/latest.json' "$app/Contents/Resources/app/extensions/furnace-workspace/package.json"
          # The editor starts with the Furnace extension and stays up.
          profile="$RUNNER_TEMP/profile"
          "$binary" --user-data-dir "$profile/data" --extensions-dir "$profile/extensions" --skip-welcome --disable-updates --new-window &
          sleep 60
          kill -0 $! || { echo "Furnace exited during startup"; exit 1; }
          grep -rl 'ai-gui.workspace-product' "$profile/data/logs" | head -5 || true
          grep -rq 'ai-gui.workspace-product' "$profile/data/logs" || { echo "Furnace extension not seen in the logs"; exit 1; }
          kill $! || true

      - name: Update installs in place (quit, swap, reopen)
        run: node prototypes/code-oss/scripts/update-smoke.mjs darwin "$(ls -d prototypes/code-oss/VSCode-darwin-arm64/*.app)" prototypes/code-oss/.cache/dist/Furnace-darwin-arm64.zip

      - name: Connection service starts and ChatGPT sign-in reaches the browser
        run: |
          app="$(ls -d prototypes/code-oss/VSCode-darwin-arm64/*.app)"
          node prototypes/code-oss/scripts/connections-smoke.mjs "$app/Contents/MacOS/$(ls "$app/Contents/MacOS")" "$app/Contents/Resources/app/extensions/furnace-workspace" --sign-in

  windows:
    name: Windows (x64)
    # windows-2022 (Visual Studio 2022), like upstream's own CI: windows-latest has Visual Studio
    # 2026, which upstream's preinstall check (2019/2022 only) rejects.
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      UPSTREAM: prototypes/code-oss/upstream
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Keep LF line endings in both checkouts, as on Linux and macOS: the patches are LF, and
      # upstream pins build/*.ts to LF while autocrlf would turn src/ into CRLF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the upstream pin
        id: pin
        run: |
          echo "tag=$(node -p "require('./prototypes/code-oss/upstream-pin.json').tag")" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p "require('./prototypes/code-oss/upstream-pin.json').node")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pin.outputs.node }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Toolchain, disk and Windows SDK
        run: |
          node --version; python --version; df -h .
          git config --global core.longpaths true
          # Upstream's packaging strips signatures with signtool; put the newest SDK on PATH.
          sdk="$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/10."*/x64 | sort -V | tail -1)"
          test -x "$sdk/signtool.exe"
          cygpath -w "$sdk" >> "$GITHUB_PATH"

      # See the macOS job.
      - name: Restore the prepared Code OSS source and its dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UPSTREAM }}
          key: upstream-v1-${{ runner.os }}-x64-${{ hashFiles('prototypes/code-oss/upstream-pin.json', 'prototypes/code-oss/patches/**') }}

      - name: Fetch the pinned Code OSS source
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" https://github.com/microsoft/vscode.git "$UPSTREAM"

      - name: Patch upstream and set the Furnace product identity and icons
        run: node prototypes/code-oss/scripts/package-windows.mjs prepare ${{ steps.cache.outputs.cache-hit == 'true' && '--cached' || '' }}

      - name: Install Code OSS dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.UPSTREAM }}
        env:
          npm_config_arch: x64
          npm_config_foreground_scripts: 'true'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retrying"
          done
          exit 1

      - name: Cache the prepared Code OSS source and its dependencies
        if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UPSTREAM }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build and package Code OSS (win32-x64, minified)
        working-directory: ${{ env.UPSTREAM }}
        run: npm run gulp vscode-win32-x64-min

      - name: Build Furnace
        run: |
          npm ci
          npm run build

      - name: Assemble Furnace into the app
        run: node prototypes/code-oss/scripts/package-windows.mjs assemble x64

      - name: Build the per-user installer
        working-directory: ${{ env.UPSTREAM }}
        run: |
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup
          cd ../../.. && node prototypes/code-oss/scripts/package-windows.mjs collect x64

      # Upload before the checks, so a failing check still leaves the build to inspect.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Furnace-win32-x64
          path: |
            prototypes/code-oss/.cache/dist/FurnaceUserSetup-x64.exe
            prototypes/code-oss/.cache/dist/READ ME FIRST.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Furnace tests on Windows
        run: |
          npm run typecheck
          npm test

      - name: Smoke test the packaged app
        run: |
          exe="prototypes/code-oss/VSCode-win32-x64/Furnace.exe"
          temp="$(cygpath -w "$RUNNER_TEMP")"
          # The app entry refuses host entries outside its built-in extensions.
          echo "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/ran', 'yes')" > "$RUNNER_TEMP/outside.cjs"
          if "$exe" "$temp\\outside.cjs" --assistant-service "$temp" 2> "$RUNNER_TEMP/refused.txt"; then echo "outside entry was not refused"; exit 1; fi
          grep 'refusing to run' "$RUNNER_TEMP/refused.txt" || echo "(no stderr from the GUI process; exit code checked)"
          test ! -e "$RUNNER_TEMP/ran"
          # The release build carries the update feed and its public key.
          grep -rq 'releases/latest/download/latest.json' prototypes/code-oss/VSCode-win32-x64 --include=package.json
          # The editor starts with the Furnace extension and stays up.
          "$exe" --user-data-dir "$temp\\profile\\data" --extensions-dir "$temp\\profile\\extensions" --skip-welcome --disable-updates --new-window &
          sleep 60
          tasklist //FI "IMAGENAME eq Furnace.exe" | grep -q Furnace.exe || { echo "Furnace exited during startup"; exit 1; }
          grep -rq 'ai-gui.workspace-product' "$RUNNER_TEMP/profile/data/logs" || { echo "Furnace extension not seen in the logs"; exit 1; }
          taskkill //IM Furnace.exe //F //T || true

      - name: Update installs in place (quit, reinstall, reopen)
        run: node prototypes/code-oss/scripts/update-smoke.mjs win32 "$(cygpath -w prototypes/code-oss/.cache/dist/FurnaceUserSetup-x64.exe)"

      - name: Connection service starts and ChatGPT sign-in reaches the browser
        run: node prototypes/code-oss/scripts/connections-smoke.mjs "$(cygpath -w prototypes/code-oss/VSCode-win32-x64/Furnace.exe)" "$(cygpath -w prototypes/code-oss/VSCode-win32-x64/resources/app/extensions/furnace-workspace)" --sign-in

  linux:
    name: Linux (x64)
    # Ubuntu 24.04: its GCC 13 compiles Electron 43's V8 headers (22.04's GCC 11 can't). The packages
    # need glibc 2.39: Ubuntu 24.04+, Debian 13+ and Fedora 40+.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      UPSTREAM: prototypes/code-oss/upstream
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the upstream pin
        id: pin
        run: |
          echo "tag=$(node -p "require('./prototypes/code-oss/upstream-pin.json').tag")" >> "$GITHUB_OUTPUT"
          echo "node=$(node -p "require('./prototypes/code-oss/upstream-pin.json').node")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pin.outputs.node }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Build tools and disk
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            fakeroot rpm dpkg-dev xvfb libgtk-3-0t64 libgbm1 libnss3 libasound2t64
          python3 -m pip install setuptools
          df -h .

      # See the macOS job.
      - name: Restore the prepared Code OSS source and its dependencies
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UPSTREAM }}
          key: upstream-v1-${{ runner.os }}-x64-${{ hashFiles('prototypes/code-oss/upstream-pin.json', 'prototypes/code-oss/patches/**') }}

      - name: Fetch the pinned Code OSS source
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" https://github.com/microsoft/vscode.git "$UPSTREAM"

      - name: Patch upstream and set the Furnace product identity and icons
        run: node prototypes/code-oss/scripts/package-linux.mjs prepare ${{ steps.cache.outputs.cache-hit == 'true' && '--cached' || '' }}

      - name: Install Code OSS dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.UPSTREAM }}
        env:
          npm_config_arch: x64
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i), retrying"
          done
          exit 1

      - name: Cache the prepared Code OSS source and its dependencies
        if: steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.UPSTREAM }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build and package Code OSS (linux-x64, minified)
        working-directory: ${{ env.UPSTREAM }}
        run: npm run gulp vscode-linux-x64-min

      - name: Build Furnace (with the Landlock command sandbox)
        run: |
          npm ci
          npm run build
          test -x prototypes/code-oss/.cache/product/sandbox/ai-gui-sandbox

      - name: Assemble Furnace into the app
        run: node prototypes/code-oss/scripts/package-linux.mjs assemble x64

      - name: Build the .deb and .rpm
        working-directory: ${{ env.UPSTREAM }}
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-prepare-rpm
          node ../scripts/package-linux.mjs packaging x64
          npm run gulp vscode-linux-x64-build-deb
          npm run gulp vscode-linux-x64-build-rpm
          node ../scripts/package-linux.mjs collect x64
          dpkg-deb --info ../.cache/dist/Furnace-linux-x64.deb
          rpm -qip ../.cache/dist/Furnace-linux-x64.rpm
          # Both carry Furnace's version (with epoch 1), not Code OSS's.
          version="$(node -p "require('../product/package.json').version")"
          test "$(dpkg-deb -f ../.cache/dist/Furnace-linux-x64.deb Version)" = "1:$version"
          test "$(rpm -qp --qf '%{EPOCH}:%{VERSION}' ../.cache/dist/Furnace-linux-x64.rpm)" = "1:$version"

      # Upload before the checks, so a failing check still leaves the build to inspect.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Furnace-linux-x64
          path: |
            prototypes/code-oss/.cache/dist/Furnace-linux-x64.deb
            prototypes/code-oss/.cache/dist/Furnace-linux-x64.rpm
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Furnace tests on Linux
        run: |
          npm run typecheck
          npm test

      - name: Smoke test the installed .deb
        run: |
          sudo apt-get install -y ./prototypes/code-oss/.cache/dist/Furnace-linux-x64.deb
          # No Microsoft repository or key; the command link and the setuid sandbox helper are in place.
          if ls /etc/apt/sources.list.d/ | grep -qi vscode; then echo "the package added a VS Code repository"; exit 1; fi
          test ! -e /usr/share/keyrings/microsoft.gpg
          test -L /usr/bin/furnace
          test "$(stat -c '%a %U' /usr/share/furnace/chrome-sandbox)" = "4755 root"
          # The app entry refuses host entries outside its built-in extensions. xvfb-run sends the
          # program's stderr to stdout, so capture both.
          echo "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/ran', 'yes')" > "$RUNNER_TEMP/outside.cjs"
          if xvfb-run -a /usr/share/furnace/furnace "$RUNNER_TEMP/outside.cjs" --assistant-service "$RUNNER_TEMP" > "$RUNNER_TEMP/refused.txt" 2>&1; then echo "outside entry was not refused"; exit 1; fi
          grep -q 'refusing to run' "$RUNNER_TEMP/refused.txt"
          test ! -e "$RUNNER_TEMP/ran"
          # The release build carries the update feed and its public key.
          grep -q 'releases/latest/download/latest.json' /usr/share/furnace/resources/app/extensions/furnace-workspace/package.json
          # The editor starts with the Furnace extension and stays up.
          profile="$RUNNER_TEMP/profile"
          xvfb-run -a /usr/share/furnace/furnace --user-data-dir "$profile/data" --extensions-dir "$profile/extensions" --skip-welcome --disable-updates --new-window &
          sleep 60
          pgrep -f /usr/share/furnace/furnace > /dev/null || { echo "Furnace exited during startup"; exit 1; }
          grep -rq 'ai-gui.workspace-product' "$profile/data/logs" || { echo "Furnace extension not seen in the logs"; exit 1; }
          pkill -f /usr/share/furnace/furnace || true

      - name: Update installs in place (quit, reinstall the package, reopen)
        # Furnace installs updates only where pkexec exists (desktop Ubuntu has it; the 24.04 runner
        # image doesn't). The test itself elevates with sudo.
        run: |
          sudo apt-get install -y pkexec
          xvfb-run -a node prototypes/code-oss/scripts/update-smoke.mjs linux prototypes/code-oss/.cache/dist/Furnace-linux-x64.deb

      - name: Connection service starts
        run: xvfb-run -a node prototypes/code-oss/scripts/connections-smoke.mjs /usr/share/furnace/furnace /usr/share/furnace/resources/app/extensions/furnace-workspace

      - name: The .rpm installs on Fedora
        run: |
          docker run --rm -v "$PWD/prototypes/code-oss/.cache/dist:/dist:ro" fedora:41 sh -c \
            'dnf install -y /dist/Furnace-linux-x64.rpm && test -L /usr/bin/furnace && test -u /usr/share/furnace/chrome-sandbox && test -e /usr/share/furnace/resources/app/extensions/furnace-workspace/package.json'

  release:
    name: Draft release
    needs: [macos, windows, linux]
    # Plain version tags (v0.2.1) only; suffixed tags, main, pull requests and manual runs only build.
    # Runs when at least one platform passed, and releases only those.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') &&
      (needs.macos.result == 'success' || needs.windows.result == 'success' || needs.linux.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: The tag matches the product version
        run: |
          version="$(node -p "require('./prototypes/code-oss/product/package.json').version")"
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match the product version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: built
          merge-multiple: true

      # A failed platform's job may still have uploaded its build (uploads come before the checks).
      - name: Keep the platforms that passed
        env:
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
        run: |
          mkdir dist
          included=() missing=()
          if [ "$MACOS" = success ]; then cp built/Furnace-darwin-arm64.dmg built/Furnace-darwin-arm64.zip dist/; included+=(macOS); else missing+=(macOS); fi
          if [ "$WINDOWS" = success ]; then cp built/FurnaceUserSetup-x64.exe dist/; included+=(Windows); else missing+=(Windows); fi
          if [ "$LINUX" = success ]; then cp built/Furnace-linux-x64.deb built/Furnace-linux-x64.rpm dist/; included+=(Linux); else missing+=(Linux); fi
          echo "INCLUDED=${included[*]}" >> "$GITHUB_ENV"
          echo "MISSING=${missing[*]}" >> "$GITHUB_ENV"
          ls -l dist

      - name: Sign the update feed
        env:
          FURNACE_UPDATE_KEY: ${{ secrets.FURNACE_UPDATE_KEY }}
        run: node prototypes/code-oss/scripts/release-feed.mjs "$VERSION" dist

      - name: Create or update the release
        run: |
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          downloads=(dist/Furnace*)
          if [ "$state" = false ]; then
            # Published: only add platforms it doesn't have yet (a re-run of a failed job), never
            # replace a published download. The new feed lists every platform of this run, so the
            # downloads already published must be this run's builds.
            published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | select(.name | startswith("Furnace")) | .name + " " + (.digest // "")')"
            new=()
            for file in "${downloads[@]}"; do
              name="$(basename "$file")"
              digest="$(awk -v n="$name" '$1 == n { print $2 }' <<< "$published")"
              if ! grep -q "^$name " <<< "$published"; then new+=("$file"); continue; fi
              test "$digest" = "sha256:$(sha256sum "$file" | cut -d' ' -f1)" || { echo "$TAG is published with a different $name than this run built; make a new version instead."; exit 1; }
            done
            while read -r name _; do
              [ -z "$name" ] || [ -e "dist/$name" ] || { echo "$TAG is published with $name, which this run didn't build; make a new version instead."; exit 1; }
            done <<< "$published"
            [ "${#new[@]}" -gt 0 ] || { echo "$TAG is already published with every platform that passed; make a new version instead."; exit 1; }
            gh release upload "$TAG" "${new[@]}"
            gh release upload "$TAG" --clobber dist/latest.json dist/latest.json.sig
            echo "Added to the published $TAG: ${new[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$state" = missing ]; then
            {
              echo "## Furnace $VERSION"
              echo
              echo "_Write what's new here before publishing._"
              echo
              echo "### Install"
              if [ -e dist/Furnace-darwin-arm64.dmg ]; then echo "- **macOS (Apple Silicon):** download \`Furnace-darwin-arm64.dmg\`, drag Furnace to Applications, then open it with System Settings → Privacy & Security → **Open Anyway** (Furnace isn't notarized yet)."; fi
              if [ -e dist/FurnaceUserSetup-x64.exe ]; then echo "- **Windows (x64):** run \`FurnaceUserSetup-x64.exe\`. If SmartScreen appears, choose **More info → Run anyway** (the installer isn't code-signed yet)."; fi
              if [ -e dist/Furnace-linux-x64.deb ]; then echo "- **Linux (x64):** Ubuntu or Debian: \`sudo apt install ./Furnace-linux-x64.deb\`. Fedora: \`sudo dnf install ./Furnace-linux-x64.rpm\`."; fi
              echo
              echo "Already using Furnace 0.2.0 or later? It offers this update by itself and installs it in place."
            } > notes.md
            gh release create "$TAG" --draft --verify-tag --title "Furnace $VERSION" --notes-file notes.md "${downloads[@]}" dist/latest.json dist/latest.json.sig
          else
            gh release upload "$TAG" --clobber "${downloads[@]}" dist/latest.json dist/latest.json.sig
          fi
          {
            echo "Draft release ready with: $INCLUDED. Publish it on GitHub to ship $TAG."
            if [ -n "$MISSING" ]; then echo; echo "**Not included: $MISSING.** For a flaky failure, \`gh run rerun $GITHUB_RUN_ID --failed\` adds it (also after publishing); a failure that needs a fix ships in the next version."; fi
          } >> "$GITHUB_STEP_SUMMARY"
